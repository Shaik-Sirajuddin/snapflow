<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Snapflow panel demo</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas
      id="canvas"
      width="640"
      height="720"
      style="width: 100vw; height: 100vh"
      data-slint-auto-resize-to-preferred="false"
      aria-label="Snapflow interactive panel"
    ></canvas>
    <script type="module">
      import init, { mount, resize } from "./pkg/panel_rust_web_demo.js";
      import { runMarketingAutopilot } from "./demo-autopilot.js";

      await init();
      mount();
      const resizePanel = () => resize(window.innerWidth, window.innerHeight);
      new ResizeObserver(resizePanel).observe(document.body);
      resizePanel();
      runMarketingAutopilot({ canvas: document.querySelector("#canvas") });
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          window.parent.postMessage({ type: "snapflow-panel-render-ready" }, window.location.origin);
        });
      });
    </script>
  </body>
</html>
