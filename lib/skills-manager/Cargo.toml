[package]
name = "skills-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Vendor(custom-agent-format)-scoped, SQLite-backed skill manager: central skill store + symlink/copy sync into per-agent skill directories. Standalone lib crate consumed by panel-rust via path dependency."

[lib]
# lib-only: no [[bin]] section in this crate.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
walkdir = "2.5"
dirs = "5.0"
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
# rusqlite already has "bundled" unconditionally above (matches acpx-core's
# precedent, not panel-rust's windows-only override) so no per-platform
# rusqlite line is needed here -- just the junction fallback for symlink_dir.
junction = "2"

[dev-dependencies]
tempfile = "3"
